<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Logo Design Portfolio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">Logo Design Studio</span>
    </div>
  </nav>

  <div class="container">
    <section id="portfolio" class="mb-5">
      <h2 class="mb-3">포트폴리오 업로드</h2>
      <input type="file" id="image-input" accept="image/*" multiple class="form-control mb-3" />
      <div id="gallery" class="row g-3"></div>
    </section>

    <section id="services" class="mb-5">
      <h2 class="mb-3">서비스 상품</h2>
      <div class="row g-3">
        <div class="col-md-4">
          <div class="card h-100">
            <div class="card-body">
              <h5 class="card-title">베이직</h5>
              <p class="card-text">간단한 로고 1종</p>
              <p class="card-text fw-bold">₩50,000</p>
              <button class="btn btn-primary w-100" data-service="베이직">주문하기</button>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card h-100">
            <div class="card-body">
              <h5 class="card-title">스탠다드</h5>
              <p class="card-text">로고 2종 + 수정 2회</p>
              <p class="card-text fw-bold">₩100,000</p>
              <button class="btn btn-primary w-100" data-service="스탠다드">주문하기</button>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card h-100">
            <div class="card-body">
              <h5 class="card-title">프리미엄</h5>
              <p class="card-text">로고 3종 + 브랜딩 가이드</p>
              <p class="card-text fw-bold">₩200,000</p>
              <button class="btn btn-primary w-100" data-service="프리미엄">주문하기</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section id="contact" class="mb-5">
      <h2 class="mb-3">문의하기</h2>
      <form id="contact-form">
        <div class="mb-3">
          <label for="name" class="form-label">이름</label>
          <input type="text" id="name" class="form-control" required />
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">이메일</label>
          <input type="email" id="email" class="form-control" required />
        </div>
        <div class="mb-3">
          <label for="message" class="form-label">메세지</label>
          <textarea id="message" class="form-control" rows="3" required></textarea>
        </div>
        <button type="submit" class="btn btn-success">보내기</button>
      </form>
    </section>
  </div>

  <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
